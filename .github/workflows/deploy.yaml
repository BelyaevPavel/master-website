name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # или ваша основная ветка
  workflow_dispatch: # ручной запуск

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # соответствует вашему engines
          cache: 'npm' # или yarn/pnpm – смотрите по lock-файлу

      - name: Install dependencies
        run: npm ci # более быстрая и надежная установка

      - name: Build with Astro
        run: npm run build
        env:
          PUBLIC_SITE: ${{ vars.PUBLIC_SITE }}
          PUBLIC_BASE: ${{ vars.PUBLIC_BASE }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
